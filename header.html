<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidCamera Header</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="header.css">
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <div class="logo">
                <a href="#">MID<span>CAMERA</span></a>
            </div>

            <nav class="nav-menu">
                <ul>
                    <li><a href="#" class="active">Trang chủ</a></li>
                    <li><a href="#">Máy ảnh</a></li>
                    <li><a href="#">Ống kính</a></li>
                    <li><a href="#">Phụ kiện</a></li>
                    <li><a href="#">Bảng giá</a></li>
                    <li><a href="#">Chính sách thuê</a></li>
                </ul>
            </nav>

            <div class="header-actions">
                <div class="search-box">
                    <input type="text" placeholder="Tìm máy ảnh, ống kính...">
                    <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
                
                <a href="#" class="action-icon" title="Giỏ hàng">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-count">0</span>
                </a>
                
                <a href="#" class="action-icon" title="Tài khoản">
                    <i class="fa-solid fa-user"></i>
                </a>
            </div>
        </div>
    </header>

</body>
</html>
